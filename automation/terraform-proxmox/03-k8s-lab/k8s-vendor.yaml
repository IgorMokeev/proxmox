#cloud-config
# =====================================================================
# k8s-vendor.yaml — подготовка узла к Kubernetes (Debian/Ubuntu)
# ---------------------------------------------------------------------
# Этот файл НЕ читается Terraform напрямую. Вы копируете его на Proxmox:
#   scp k8s-vendor.yaml root@10.1.1.20:/var/lib/vz/snippets/
# и cloud-init выполняет его при первом запуске каждой ВМ.
#
# Версия Kubernetes: v1.36 (указана в двух строках ниже). Чтобы взять
# другую — замените "v1.36" на нужную (например v1.37) в обеих строках
# и заново скопируйте файл на Proxmox ДО первого запуска ВМ.
# =====================================================================

timezone: Europe/Moscow

package_update: true
packages:
  - qemu-guest-agent
  - ca-certificates
  - curl
  - gpg
  - apt-transport-https
  - containerd

write_files:
  - path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
  - path: /etc/sysctl.d/99-k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

runcmd:
  - systemctl enable --now qemu-guest-agent
  # Модули ядра и сетевые настройки
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system
  # Swap должен быть выключен
  - swapoff -a
  - sed -i '/\sswap\s/d' /etc/fstab
  # containerd с systemd cgroup
  - mkdir -p /etc/containerd
  - containerd config default > /etc/containerd/config.toml
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
  - systemctl restart containerd
  - systemctl enable containerd
  # Репозиторий Kubernetes и пакеты (версия v1.36)
  - mkdir -p -m 755 /etc/apt/keyrings
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
  - apt-get update
  - apt-get install -y kubelet kubeadm kubectl
  - apt-mark hold kubelet kubeadm kubectl
  - systemctl enable kubelet
  # Метка "узел готов"
  - touch /var/lib/k8s-node-ready
